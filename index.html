<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sofia</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f8cdda, #fbc2eb);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: #5a0033;
}

/* floating flowers */
.flower {
    position: absolute;
    font-size: 20px;
    opacity: 0.6;
    animation: float 14s linear infinite;
}
@keyframes float {
    from { transform: translateY(110vh); }
    to { transform: translateY(-10vh); }
}

.card {
    background: #fff7fa;
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.2);
    max-width: 380px;
    text-align: center;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 26px;
    margin-bottom: 12px;
    font-weight: 600;
}

p {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 22px;
}

button {
    background: #e75480;
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    font-size: 15px;
    color: #fff;
    cursor: pointer;
    margin: 6px;
    transition: all 0.3s ease;
}

button:hover {
    background: #d63c6f;
    transform: scale(1.05);
}
</style>
</head>

<body>

<script>
for (let i = 0; i < 18; i++) {
    let f = document.createElement("div");
    f.className = "flower";
    f.innerHTML = "🌼";
    f.style.left = Math.random() * 100 + "vw";
    f.style.animationDuration = (10 + Math.random() * 8) + "s";
    document.body.appendChild(f);
}
</script>

<div class="card" id="content">
    <h1>Sofia</h1>
    <p>
        I made this quietly,<br>
        with respect and sincerity,<br>
        just to say something I often keep inside.
    </p>
    <button onclick="step1()">Continue</button>
</div>

<script>
function step1() {
    content.innerHTML = `
    <h1>A Simple Question</h1>
    <p>
        Before I go any further,<br>
        I need to ask you honestly…
    </p>
    <button onclick="step2()">Go on</button>
    `;
}

function step2() {
    content.innerHTML = `
    <h1>Tell Me Gently</h1>
    <p>
        Do I disturb you<br>
        when I care,<br>
        when I check in,<br>
        when I remember you?
    </p>
    <button onclick="step3()">No</button>
    <button onclick="step3()">Not at all</button>
    `;
}

function step3() {
    content.innerHTML = `
    <h1>Then Please Know This</h1>
    <p>
        I never speak unless I mean it.<br>
        I never show care unless it’s real.<br>
        And I never stay… without feeling something true.
    </p>
    <button onclick="step4()">Continue</button>
    `;
}

function step4() {
    content.innerHTML = `
    <h1>One Last Thought</h1>
    <p>
        If my presence ever feels quiet,<br>
        it’s because I value peace.<br>
        If it feels warm,<br>
        it’s because you matter.
    </p>
    <p style="font-size:14px; margin-top:15px;">
        — Always with respect, Sofia 🌼
    </p>
    `;
}
</script>

</body>
</html>
